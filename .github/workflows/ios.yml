name: ios

on:
    push:
        branches:
            - main
        paths:
            - 'ios/**'
            - 'shared/fixtures/**'
            - '.github/workflows/ios.yml'
    pull_request:
        paths:
            - 'ios/**'
            - 'shared/fixtures/**'
            - '.github/workflows/ios.yml'

concurrency:
    group: ios-${{ github.ref }}
    cancel-in-progress: true

jobs:
    package-tests:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v4
            - name: Show toolchain versions
              run: |
                  xcodebuild -version
                  swift --version
            - name: Run HamletKit package tests
              run: swift test --package-path ios/Packages/HamletKit

    app-build:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v4
            - name: Show toolchain versions
              run: xcodebuild -version
            - name: Check manual localization catalog
              env:
                  PYTHONDONTWRITEBYTECODE: '1'
              run: |
                  python3 ios/scripts/localizations.py --check
                  python3 -m unittest discover -s ios/scripts/tests -p 'test_localizations.py'
            - name: Build Hamlet app for iOS Simulator
              run: xcodebuild build -project ios/Hamlet.xcodeproj -scheme Hamlet -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
            - name: Transcript layout regression tests
              run: ios/scripts/test-transcript.sh
            - name: iPad navigation and layout regression tests
              env:
                  HAMLET_TEST_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPad-Air-11-inch-M2
              run: >-
                  ios/scripts/test-transcript.sh
                  -only-testing:HamletTests/SessionNavigationTests
                  -only-testing:HamletTests/SessionSplitPresentationTests
                  -only-testing:HamletTests/TranscriptTypographyTests
                  -only-testing:HamletTests/TranscriptGeometryTests
            - name: Verify localization catalog was not rewritten
              run: git diff --exit-code -- ios/Hamlet/Resources/Localizable.xcstrings
